<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-app">
        <header class="app-header">
            <h1>My Tasks</h1>
            <p>A simple JavaScript To-Do List</p>
        </header>

        <section class="section">
            <h2>Add a Task</h2>
            <div class="task-form">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    aria-label="New task description"
                >
                <button type="button" id="addButton">Add</button>
            </div>
        </section>

        <section class="section">
            <h2>Filter Tasks</h2>
            <div class="task-filters" role="group" aria-label="Filter tasks">
                <button type="button" data-filter="all" aria-pressed="true">All</button>
                <button type="button" data-filter="active" aria-pressed="false">Active</button>
                <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>
        </section>

        <section class="section">
            <h2>My Task List</h2>
            <ul id="taskList"></ul>
            <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task above!</p>
        </section>

        <footer class="app-footer">
            <p id="taskCounter">0 tasks remaining</p>
            <button type="button" id="clearCompletedButton">Clear completed</button>
        </footer>
    </main>
</body>
</html>
